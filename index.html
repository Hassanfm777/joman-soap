<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر جُمان للصابون الطبيعي</title>
    <!-- خطوط جوجل العربية (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ملف التصميم -->
    <link rel="stylesheet" href="style.css">
    <!-- كود تسجيل الدخول للوحة التحكم -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="container">
            <h1 class="logo">جُمان للصابون الطبيعي</h1>
            <nav>
                <a href="#">الرئيسية</a>
                <a href="#shop">المنتجات</a>
                <a href="#">تواصل معنا</a>
            </nav>
        </div>
    </header>

    <!-- القسم الترحيبي (Hero) -->
    <section class="hero">
        <div class="hero-content">
            <h2>عناية طبيعية تليق ببشرتك</h2>
            <p>نقدم لك تشكيلة من أفضل أنواع الصابون الطبيعي المصنوع يدوياً بكل حب وعناية، خالي من المواد الكيميائية الضارة.</p>
            <a href="#shop" class="btn">تسوق الآن</a>
        </div>
    </section>

    <!-- قسم المنتجات -->
    <section id="shop" class="products-section">
        <div class="container">
            <h2 class="section-title">أحدث منتجاتنا</h2>
            
            <!-- هنا سيتم عرض المنتجات تلقائياً من لوحة التحكم -->
            <div id="product-container" class="products-grid">
                <p style="text-align: center; width: 100%;">جاري تحميل المنتجات...</p>
            </div>

        </div>
    </section>

    <!-- الفوتر (أسفل الموقع) -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - متجر جُمان للصابون الطبيعي</p>
    </footer>

    <!-- كود الجافاسكربت لجلب المنتجات من لوحة التحكم -->
    <script>
        // سحب المنتجات من ملف JSON
        fetch('data/products.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('product-container');
                container.innerHTML = ''; // مسح رسالة "جاري التحميل"

                // ترتيب المنتجات الأحدث أولاً (اختياري)
                data.products.reverse().forEach(product => {
                    const productCard = `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${product.image}" alt="${product.name}">
                            </div>
                            <div class="product-info">
                                <h3>${product.name}</h3>
                                <p class="description">${product.description}</p>
                                <div class="price-action">
                                    <span class="price">${product.price} درهم</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += productCard;
                });
            })
            .catch(error => {
                console.error('Error loading products:', error);
                document.getElementById('product-container').innerHTML = '<p>عذراً، حدث خطأ في تحميل المنتجات.</p>';
            });
    </script>
</body>
</html>
